<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foundry (framed)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="board">
      <h1>A page that embeds the game</h1>
      <p class="lede">
        The frame below is <strong>cross-origin</strong> (<code>localhost</code> embedding
        <code>127.0.0.1</code>): the case WasmCheat has to handle on real sites.
      </p>
      <iframe id="game" title="Foundry game frame" class="frame"></iframe>
    </main>
    <script>
      // A different host name is a different origin, which is what a real embed looks like.
      document.getElementById('game').src = `http://localhost:${location.port}/index.html`;
    </script>
  </body>
</html>
