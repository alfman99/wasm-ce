<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foundry (framed)</title>
    <style>
      body {
        margin: 0;
        background: #14161a;
        color: #cfd3da;
        font: 14px/1.5 system-ui, sans-serif;
        padding: 12px 16px;
      }
      iframe {
        width: 100%;
        height: 78vh;
        border: 1px solid #2a2f38;
        border-radius: 12px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <p>
      The game below runs in a <strong>cross-origin iframe</strong> (<code>localhost</code> embedding
      <code>127.0.0.1</code>): the case WasmCheat has to handle on real sites.
    </p>
    <iframe id="game" title="Foundry game frame"></iframe>
    <script>
      // A different host name is a different origin, which is what a real embed looks like.
      document.getElementById('game').src = `http://localhost:${location.port}/index.html`;
    </script>
  </body>
</html>
