<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Foundry · nested worker build</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Foundry <span class="tag">nested worker</span></h1>
      <p class="lede">
        The page starts a relay worker, and the relay starts the game worker. The wasm is two realms
        below the page, which is exactly what a naive memory tool misses.
      </p>
      <section class="hud">
        <div><span class="label">score</span><b id="score">0</b></div>
        <div><span class="label">ore</span><b id="coins">0</b></div>
      </section>
      <div class="row">
        <button id="mine" type="button">Mine</button>
        <button id="damage" type="button">Hazard</button>
        <button id="reset" type="button">Reset</button>
      </div>
      <p id="status" class="status">starting relay worker…</p>
    </main>
    <script src="nested-demo.js"></script>
  </body>
</html>
