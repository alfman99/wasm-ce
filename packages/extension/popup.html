<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>WasmCheat</title>
  </head>
  <body>
    <div class="shell">
      <div class="titlebar">
        <h1>WasmCheat</h1>
        <span class="spacer"></span>
        <span id="bridge" class="pill pill--idle">bridge offline</span>
        <span class="close" aria-hidden="true">×</span>
      </div>
      <p class="lede">
        Approve a tab before an agent can read or change its WebAssembly memory. Every write and hook
        script lands in the audit log.
      </p>
      <ul id="tabs" class="tabs"></ul>
      <section class="token">
        <label class="micro" for="bridge-token">bridge token</label>
        <div class="token__row">
          <input id="bridge-token" type="password" placeholder="from ~/.wasmcheat/token" autocomplete="off" />
          <button id="token-save" class="ghost" type="button">Save</button>
        </div>
        <span id="token-hint" class="micro"></span>
      </section>
      <footer>
        <span id="hint">Waiting for tabs…</span>
        <button id="refresh" class="ghost" type="button">Refresh</button>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
