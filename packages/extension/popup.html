<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>WasmCheat</title>
  </head>
  <body>
    <div class="shell">
      <header class="head">
        <span class="mark" aria-hidden="true"></span>
        <h1>WasmCheat</h1>
        <span class="spacer"></span>
        <span id="bridge" class="pill pill--idle">MCP ?</span>
      </header>

      <section class="card" aria-label="This tab">
        <span class="micro">This tab</span>
        <p id="target" class="target">Reading the tab…</p>
        <p id="state" class="state"></p>
        <button id="site" class="ghost" type="button" hidden></button>
      </section>

      <p id="hint" class="lede">
        Open DevTools on this tab and choose the WasmCheat panel. Every change you make is recorded in
        the audit log.
      </p>

      <details class="token" id="token-box" hidden>
        <summary class="micro" id="token-title">Bridge token</summary>
        <div class="token__row">
          <input id="bridge-token" type="password" placeholder="contents of ~/.wasmcheat/token" autocomplete="off" />
          <button id="token-save" class="ghost" type="button">Save</button>
        </div>
        <span id="token-hint" class="micro"></span>
      </details>

      <footer>
        <span id="note" class="micro"></span>
        <button id="refresh" class="ghost" type="button">Refresh</button>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
